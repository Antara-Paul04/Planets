<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>a quiet universe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="intro">
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="intro-line">there are worlds out there</div>
    <div id="hint">drag to look around · scroll to zoom · click a planet or a distant sun to travel</div>
    <button id="create-btn">make a planet</button>
    <button id="find-btn" class="gone">find my planet</button>
    <button id="jump-btn">jump to the nearest star</button>
    <div id="planet-label" class="label-hidden">
      <div class="label-name"></div>
      <div class="label-sub"></div>
      <div class="label-star"></div>
      <button class="label-report">report</button>
    </div>
    <div id="audio-ctl">
      <button id="audio-btn" title="sound on">&#9834;</button>
      <input id="audio-vol" type="range" min="0" max="100" />
    </div>
    <button id="search-btn" title="search the universe" aria-label="search the universe"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.4" y1="15.4" x2="21" y2="21" stroke-linecap="round"/></svg></button>
    <button id="info-btn" title="a note from the universe" aria-label="information">&#9432;</button>
    <div id="universe-status">the universe is temporarily unavailable</div>
    <div id="toast">
      <div class="toast-name"></div>
      <div class="toast-sub">now somewhere in the universe</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
